name: Daily Sponsor Ledger Sync & Deployment

on:
  schedule:
    - cron: '0 6 * * 1-5'  # Mon-Fri 06:00 UTC
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Ingestion State
        id: state_prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/state
          if gh release download state-anchor -p "previous_state.json" --dir /tmp/state 2>/dev/null; then
            echo "Loaded previous state from release asset."
          else
            echo "Release asset not found. Bootstrapping state from repository."
            cp data/sponsors.json /tmp/state/previous_state.json || touch /tmp/state/previous_state.json
          fi

      - name: Run Daily Ingestion & Diff Engine
        id: ingest
        run: |
          python3 scripts/daily_ingest.py \
            --prev /tmp/state/previous_state.json \
            --out-state /tmp/state/current_state.json \
            --out-dir ./data \
            --out-delta ./data/deltas

      - name: Update State Anchor in GitHub Releases (Zero Git Bloat)
        if: steps.ingest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload state-anchor /tmp/state/current_state.json#previous_state.json --clobber 2>/dev/null || \
          gh release create state-anchor /tmp/state/current_state.json#previous_state.json --title "State Anchor" --notes "Rolling internal state anchor for daily diffing" --prerelease || true

      - name: Commit & Push Updated Data Payloads
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "knowyoursponsor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): sync sponsor register $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !always())
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
