name: Daily Sponsor Ledger Sync

on:
  schedule:
    - cron: '0 6 * * 1-5'  # Mon-Fri 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Ingestion State & Bootstrap Reference Datasets
        id: state_prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/state data

          # 1. Download previous state for delta diffing
          if gh release download state-anchor -p "sponsors.json" --dir /tmp/state 2>/dev/null; then
            mv /tmp/state/sponsors.json /tmp/state/previous_state.json
            echo "Loaded previous state from release asset (sponsors.json)."
          elif gh release download state-anchor -p "current_state.json" --dir /tmp/state 2>/dev/null; then
            mv /tmp/state/current_state.json /tmp/state/previous_state.json
            echo "Loaded previous state from release asset (current_state.json)."
          else
            echo "Bootstrapping previous state from live CDN..."
            curl -s -L "https://zephyr4289.github.io/sponsor-g/data/sponsors.json" -o /tmp/state/previous_state.json || touch /tmp/state/previous_state.json
          fi

          # 2. Bootstrap company_flags.json for solvency metric calculation
          if [ ! -s "data/company_flags.json" ]; then
            echo "Bootstrapping company_flags.json..."
            gh release download state-anchor -p "company_flags.json" --dir data/ 2>/dev/null ||             curl -s -L "https://zephyr4289.github.io/sponsor-g/data/company_flags.json" -o data/company_flags.json || touch data/company_flags.json
          fi

      - name: Run Daily Ingestion & Diff Engine
        id: ingest
        run: |
          python3 scripts/daily_ingest.py \
            --prev /tmp/state/previous_state.json \
            --out-state /tmp/state/current_state.json \
            --out-dir ./data \
            --out-delta ./data/deltas

      - name: Update State Anchor & Data Assets in GitHub Releases (Zero Git Bloat)
        if: steps.ingest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload state-anchor \
            data/sponsors.json#sponsors.json \
            data/company_flags.json#company_flags.json \
            --clobber 2>/dev/null || \
          gh release create state-anchor \
            data/sponsors.json#sponsors.json \
            data/company_flags.json#company_flags.json \
            --title "State Anchor" --notes "Rolling internal state anchor for daily diffing" --prerelease || true

      - name: Commit & Push Lightweight Audit Trails (Deltas & Meta Only)
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "knowyoursponsor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): sync sponsor register $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
