name: Deploy Multi-Branch to GitHub Pages

on:
  push:
    branches: ["main", "V1"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch (Production Root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Checkout V1 branch (Preview /v1)
        uses: actions/checkout@v4
        with:
          ref: V1
          path: _v1

      - name: Assemble multi-branch site & hydrate datasets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/v1
          # Copy main to site root
          cp -a _main/. site/
          rm -rf site/.git site/.github
          # Copy V1 to site/v1
          cp -a _v1/. site/v1/
          rm -rf site/v1/.git site/v1/.github

          # Ensure .nojekyll markers
          touch site/.nojekyll
          touch site/v1/.nojekyll

          mkdir -p site/data site/v1/data

          # Fetch sponsors.json if missing
          if [ ! -s "site/data/sponsors.json" ]; then
            echo "Hydrating sponsors.json..."
            (gh release download state-anchor -p "sponsors.json" --dir site/data/ 2>/dev/null) ||             (gh release download state-anchor -p "current_state.json" --dir /tmp 2>/dev/null && cp -f /tmp/current_state.json site/data/sponsors.json) ||             curl -f -s -L "https://zephyr4289.github.io/sponsor-g/data/sponsors.json" -o site/data/sponsors.json || true
          fi

          # Fetch company_flags.json if missing
          if [ ! -s "site/data/company_flags.json" ]; then
            echo "Hydrating company_flags.json..."
            (gh release download state-anchor -p "company_flags.json" --dir site/data/ 2>/dev/null) ||             curl -f -s -L "https://zephyr4289.github.io/sponsor-g/data/company_flags.json" -o site/data/company_flags.json || true
          fi

          # Copy full data payloads to v1 preview with guards
          if [ -s "site/data/sponsors.json" ]; then
            cp -f site/data/sponsors.json site/v1/data/sponsors.json || true
          fi
          if [ -s "site/data/company_flags.json" ]; then
            cp -f site/data/company_flags.json site/v1/data/company_flags.json || true
          fi

          # Crucial: Delete .gitignore inside publish directories so actions-gh-pages stages the hydrated JSON files
          rm -f site/.gitignore site/v1/.gitignore

          # Verify sizes
          ls -lh site/data/sponsors.json site/v1/data/sponsors.json 2>/dev/null || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: ""
