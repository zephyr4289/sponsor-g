name: Deploy Multi-Branch to GitHub Pages

on:
  push:
    branches: ["main", "V1"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch (Production Root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Checkout V1 branch (Preview /v1)
        uses: actions/checkout@v4
        with:
          ref: V1
          path: _v1

      - name: Assemble multi-branch site
        run: |
          mkdir -p site/v1
          # Copy main to site root
          cp -a _main/. site/
          rm -rf site/.git site/.github
          # Copy V1 to site/v1
          cp -a _v1/. site/v1/
          rm -rf site/v1/.git site/v1/.github
          # Ensure .nojekyll everywhere
          touch site/.nojekyll
          touch site/v1/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
