name: Publish public site

# Runs in the PRIVATE repo (sponsorsignal-core) and pushes only the public
# subset to the PUBLIC repo (sponsorsignal), which is what GitHub Pages
# serves. What crosses the boundary is decided in pipeline/publish.py, not
# here, so that a test can check it.
#
# The `if` guard on the job means this file can sit in both repos harmlessly:
# it only ever acts in core. Without it, the public repo would run this on
# every push, fail for want of a secret, and email about it.
#
# Defaults to a dry run. The first execution should show you what it *would*
# do; only then set dry_run to false.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be published without pushing"
        type: boolean
        default: true
  # Once the daily refresh lives here too, publishing follows it.
  workflow_run:
    workflows: ["Refresh sponsor register"]
    types: [completed]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'roshan1208/sponsorsignal-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s pipeline

      - name: Check the public/private boundary
        # Fails if any file in data/ is classified as neither public nor
        # internal, rather than guessing which side it belongs on.
        run: python pipeline/publish.py

      - name: Stage the public subset
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "pipeline")
          import publish

          staged = publish.stage(".", "_public")
          forbidden = publish.audit(staged)
          if forbidden:
              print("REFUSING TO PUBLISH. These must never leave core:")
              for path in forbidden:
                  print("   ", path)
              raise SystemExit(1)

          data = [p for p in staged if p.startswith("data/")]
          pages = [p for p in staged if p.endswith("index.html")]
          summary = [
              "## What would be published",
              "",
              f"- **{len(staged)}** files total",
              f"- **{len(pages)}** pages",
              f"- **{len(data)}** data files",
              "",
              "### Data files crossing the boundary",
              "",
          ] + [f"- `{p}`" for p in sorted(data)] + [
              "",
              "### Withheld",
              "",
          ] + [f"- `data/{n}` — {why}" for n, why in sorted(publish.INTERNAL_DATA.items())]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(summary) + "\n")
          print(f"staged {len(staged)} files, audit clean")
          PY

      - name: Push to the public repo
        if: inputs.dry_run != true
        env:
          # Never echoed. Actions masks secret values in logs, but the remote
          # URL is also never printed by any command below.
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/roshan1208/sponsorsignal.git" \
            _live 2>/dev/null

          # Replace the served content wholesale, but never touch .git. The
          # staging directory is the whole truth about what should be there,
          # so anything not in it is meant to be gone.
          find _live -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _public/. _live/

          cd _live
          git config user.name "sponsorsignal-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Public site already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Publish site: $(date -u +%F\ %H:%M) UTC"
          git push
          echo "Pushed to the public repo." >> "$GITHUB_STEP_SUMMARY"

      - name: Note that this was a dry run
        if: inputs.dry_run == true
        run: |
          {
            echo ""
            echo "> **Dry run.** Nothing was pushed."
            echo "> Re-run with \`dry_run\` unchecked to publish."
          } >> "$GITHUB_STEP_SUMMARY"
